# Backup diário dos dados do Supabase para a pasta dados/ deste repositório.
# Só roda em repositório PRIVADO: num repositório público, os dados da empresa ficariam abertos na internet.
# Roda todo dia às 3h (horário de Brasília) e também pelo botão "Run workflow" na aba Actions.
# Precisa dos segredos SUPABASE_URL e SUPABASE_CHAVE (Settings, Secrets and variables, Actions).
name: Backup diário

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    # repositório público: o job é pulado, para não expor os dados da empresa
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copiar banco e anexos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CHAVE: ${{ secrets.SUPABASE_CHAVE }}
        run: node scripts/backup.mjs
      - name: Guardar no repositório
        run: |
          git config user.name "Backup do sistema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f dados
          if git diff --cached --quiet; then echo "Nada mudou desde o último backup."; exit 0; fi
          git commit -m "Backup diário $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          git pull --rebase
          git push
